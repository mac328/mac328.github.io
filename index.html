<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>328 Studio</title>
    <meta
      name="description"
      content="328 Studio が提供するアプリの案内と、お問い合わせ先。"
    />
    <style>
      :root {
        --bg: #fbf7ee;
        --card: #ffffff;
        --line: #eae2ce;
        --ink: #33302a;
        --sub: #8b8577;
        --gold: #f59e0b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui,
          sans-serif;
        line-height: 1.8;
      }
      .wrap {
        max-width: 620px;
        margin: 0 auto;
        padding: 48px 20px 60px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 4px;
      }
      .lead {
        color: var(--sub);
        font-size: 15px;
        margin: 0 0 32px;
      }
      h2 {
        font-size: 15px;
        color: var(--sub);
        font-weight: 400;
        letter-spacing: 1px;
        margin: 0 0 10px;
      }
      .app {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 20px;
        margin-bottom: 12px;
      }
      .app h3 {
        font-size: 18px;
        margin: 0 0 2px;
      }
      .app .kind {
        font-size: 13px;
        color: var(--gold);
        letter-spacing: 2px;
      }
      .app p {
        font-size: 14px;
        color: var(--sub);
        margin: 6px 0 12px;
      }
      .links a {
        font-size: 14px;
        color: #b87a08;
        margin-right: 16px;
      }
      .contact {
        margin-top: 32px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        font-size: 14px;
        color: var(--sub);
      }
      .contact a {
        color: #b87a08;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>328 Studio</h1>
      <p class="lead">学習アプリをメインに作っています。</p>

      <h2>提供中のアプリ</h2>

      <div class="app">
        <div class="kind">英検準2級</div>
        <h3>反復トレ</h3>
        <p>忘れた頃にまた出る。くり返して身につける学習アプリ。</p>
        <div class="links">
          <a href="https://play.google.com/store/apps/details?id=com.mac328.eikendojo"
            >Google Play</a
          >
          <a href="https://mac328.github.io/eiken-dojo/privacy.html"
            >プライバシーポリシー</a
          >
        </div>
      </div>

      <div class="contact">
        お問い合わせ: <a href="mailto:app@328.ne.jp">app@328.ne.jp</a>
      </div>
    </div>
  </body>
</html>
